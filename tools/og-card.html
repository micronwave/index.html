<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&display=block" rel="stylesheet" />
<style>
:root {
  --paper:   #e9e9e3;
  --ink:     #15171a;
  --red:     #dd2f19;
  --red-ink: #c22a16;

  /* the strip each column stands in — thirteen per cent of the card, the
     share the page gives them at this width */
  --strip: 156px;
  /* the sheet's own margin inside the strips */
  --margin-x: 62px;
  /* the two rules sit this far from the top and bottom edges — the same
     number on both, so the card is bracketed evenly */
  --margin-y: 78px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; }
body {
  position: relative;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  font-optical-sizing: auto;
  font-variation-settings: 'SOFT' 0, 'WONK' 1;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  padding: var(--margin-y) calc(var(--strip) + var(--margin-x));
}

/* the columns, exactly as the page stands them: one at either edge, the
   full height of the card, drawn by the page's own renderer — render-og.py
   lifts that script out of site/index.html and sets it at the foot of this
   file, so the card cannot drift from the page. the cell is coarser than
   the page's floor of 4.6px because a social card is seen at half its size
   or less, and a flute needs cells the eye can find at that remove. */
.order {
  position: absolute;
  top: 0; bottom: 0;
  width: var(--strip);
  margin: 0;
  font-family: 'Cascadia Mono', Consolas, 'DejaVu Sans Mono',
               'Liberation Mono', 'Courier New', ui-monospace, monospace;
  font-size: 6px;
  line-height: 1;
  letter-spacing: 0;
  white-space: pre;
  color: var(--ink);
  overflow: hidden;
}
#order   { left: 0; }
#order-r { right: 0; }
/* the renderer lays its scanline layer over the page too; a 3px screen
   drawn at 2x and downsampled is a moiré, so the card goes without */
.grain { display: none; }

/* the two heavy rules that bracket the register stack on the page */
.rule { border-top: 3px solid var(--ink); flex: 0 0 auto; }

.body { flex: 1; display: flex; align-items: center; }

h1 {
  font-size: 144px;
  font-weight: 600;
  letter-spacing: -.032em;
  line-height: .9;
}
.dom {
  margin-top: 24px;
  font-size: 52px;
  font-weight: 400;
  letter-spacing: -.014em;
  line-height: 1.1;
  color: var(--red-ink);
}
</style>
</head>
<body>
  <pre class="order" id="order" aria-hidden="true"></pre>
  <pre class="order" id="order-r" aria-hidden="true"></pre>

  <div class="rule"></div>

  <div class="body">
    <div class="lockup" id="lockup">
      <h1>Aaron<br />Altergott</h1>
      <p class="dom">altergott.dev</p>
    </div>
  </div>

  <div class="rule"></div>

<!-- ORDER -->
</body>
</html>
