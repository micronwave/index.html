<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&display=block" rel="stylesheet" />
<style>
:root {
  --paper:   #e9e9e3;
  --ink:     #15171a;
  --red:     #dd2f19;
  --red-ink: #c22a16;

  --margin-x: 88px;
  /* the two rules sit this far from the top and bottom edges — the same
     number on both, so the card is bracketed evenly */
  --margin-y: 78px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; }
body {
  position: relative;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  font-optical-sizing: auto;
  font-variation-settings: 'SOFT' 0, 'WONK' 1;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  padding: var(--margin-y) var(--margin-x);
}

/* the two heavy rules that bracket the register stack on the page */
.rule { border-top: 3px solid var(--ink); flex: 0 0 auto; }

.body { flex: 1; display: flex; align-items: center; }

h1 {
  font-size: 144px;
  font-weight: 600;
  letter-spacing: -.032em;
  line-height: .9;
}
.dom {
  margin-top: 24px;
  font-size: 52px;
  font-weight: 400;
  letter-spacing: -.014em;
  line-height: 1.1;
  color: var(--red-ink);
}

/* the favicon's mark is not set here. it has to start on the cap of "Aaron"
   and stop on the last of "altergott.dev", and only the rendered page knows
   where those are — canvas metrics cannot apply font-variation-settings, so
   they measure a different cut of Fraunces than this page draws. render-og.py
   reads the ink off the raster and lays the bar in at --margin-x from the
   right edge, 48px wide. */
</style>
</head>
<body>
  <div class="rule"></div>

  <div class="body">
    <div class="lockup" id="lockup">
      <h1>Aaron<br />Altergott</h1>
      <p class="dom">altergott.dev</p>
    </div>
  </div>

  <div class="rule"></div>

</body>
</html>
