<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&display=block" rel="stylesheet" />
<style>
:root {
  --paper:   #e9e9e3;
  --ink:     #15171a;
  --ink-2:   #52565c;
  --ink-3:   #656870;
  --ink-4:   #9a9da3;
  --red:     #dd2f19;
  --red-ink: #c22a16;
  --rule-hair: rgba(21,23,26,.11);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  font-optical-sizing: auto;
  font-variation-settings: 'SOFT' 0, 'WONK' 1;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  padding: 74px 88px;
}

/* the two heavy rules that bracket the register stack on the page */
.rule-top    { border-top: 3px solid var(--ink); }
.rule-bottom { border-top: 3px solid var(--ink); }

.body {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 400px;
  align-items: center;
  gap: 72px;
  padding: 54px 0;
}

h1 {
  font-size: 104px;
  font-weight: 600;
  letter-spacing: -.032em;
  line-height: .9;
}
.sub {
  margin-top: 26px;
  font-size: 27px;
  line-height: 1.35;
  color: var(--ink-2);
}
.sub em { font-style: italic; color: var(--ink); }

/* the contents list, as the page sets it: word, dot leader, folio */
.toc { display: flex; flex-direction: column; }
.toc li {
  list-style: none;
  display: flex; align-items: baseline; gap: 14px;
  padding: 13px 0;
  border-top: 1px solid var(--rule-hair);
  font-size: 27px;
  color: var(--ink-2);
}
.toc li:first-child { border-top: 0; }
.toc li.open { color: var(--ink); }
.leader {
  flex: 1 1 auto; height: 1em; align-self: baseline; min-width: 24px;
  background-image: radial-gradient(circle, var(--ink-4) 1.3px, transparent 1.4px);
  background-size: 8px 8px;
  background-position: left bottom 5px;
  background-repeat: repeat-x;
}
.toc li.open .leader {
  background-image: radial-gradient(circle, var(--red) 1.3px, transparent 1.4px);
}
.folio { font-size: 21px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.toc li.open .folio { color: var(--red-ink); }

.foot {
  display: flex; align-items: baseline; justify-content: space-between;
  padding-top: 22px;
  font-size: 23px;
  color: var(--ink-3);
}
.foot .dom { color: var(--red-ink); }
</style>
</head>
<body>
  <div class="rule-top"></div>

  <div class="body">
    <div>
      <h1>Aaron<br />Altergott</h1>
      <p class="sub"><em>operations engineer</em> in SoCal</p>
    </div>

    <ul class="toc">
      <li class="open"><span>about</span><span class="leader"></span><span class="folio">01</span></li>
      <li><span>work</span><span class="leader"></span><span class="folio">02</span></li>
      <li><span>projects</span><span class="leader"></span><span class="folio">03</span></li>
      <li><span>stack</span><span class="leader"></span><span class="folio">04</span></li>
    </ul>
  </div>

  <div class="rule-bottom"></div>
  <div class="foot">
    <span class="dom">altergott.dev</span>
    <span>automation · cloud infrastructure</span>
  </div>
</body>
</html>
