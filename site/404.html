<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Page not found — Aaron Altergott</title>
<meta name="theme-color" content="#e9e9e3" />
<meta name="description" content="Nothing lives at this address." />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e9e9e3'/%3E%3Crect x='13' y='4' width='6' height='24' fill='%23dd2f19'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&display=swap" rel="stylesheet" />
<style>
:root {
  --paper: #e9e9e3;
  --ink:   #15171a;
  --ink-2: #52565c;
  --ink-3: #656870;
  --red:   #dd2f19;
  --red-ink: #c22a16;
  --rule-strong: rgba(21,23,26,.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; height: 100svh; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Fraunces', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  font-optical-sizing: auto;
  font-variation-settings: 'SOFT' 0, 'WONK' 1;
  -webkit-font-smoothing: antialiased;
  display: grid;
  place-content: center;
  padding: clamp(30px, 4vw, 62px);
}
::selection { background: var(--red); color: var(--paper); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

main { max-width: 42ch; }
.label {
  font-size: clamp(12.6px, 1.14vw, 14.2px);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
h1 {
  margin: 14px 0 0;
  font-size: clamp(26px, 5vw, 46px);
  font-weight: 400;
  line-height: 1.05;
  letter-spacing: -.01em;
}
h1 i { font-style: italic; color: var(--red-ink); }
hr {
  border: 0;
  border-top: 1px solid var(--rule-strong);
  margin: 22px 0;
}
p {
  font-size: clamp(14px, 1.36vw, 17px);
  line-height: 1.5;
  color: var(--ink-2);
}
a.home {
  display: inline-block;
  margin-top: 26px;
  font-size: clamp(14px, 1.36vw, 17px);
  color: var(--red-ink);
  text-decoration: none;
  border-bottom: 1px solid currentColor;
  padding-bottom: 2px;
}
a.home:hover { color: var(--ink); }
</style>
</head>
<body>
<main>
  <span class="label">404</span>
  <h1>Page <i>not found</i></h1>
  <hr />
  <p>Nothing lives at this address. The portfolio is one page, and this isn&rsquo;t it.</p>
  <a class="home" href="/">Back to the contents page</a>
</main>
</body>
</html>
