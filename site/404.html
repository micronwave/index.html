<style>
:root {
  --paper: #e9e9e3;
  --ink:   #15171a;
  --ink-2: #52565c;
  --ink-3: #656870;
  --red:   #dd2f19;
  --red-ink: #c22a16;
  --rule-strong: rgba(21,23,26,.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; height: 100svh; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Fraunces', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  font-optical-sizing: auto;
  font-variation-settings: 'SOFT' 0, 'WONK' 1;

  display: grid;
  place-content: center;
  padding: clamp(30px, 4vw, 62px);
}
::selection { background: var(--red); color: var(--paper); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

main { max-width: 42ch; }
.label {
  font-size: clamp(12.6px, 1.14vw, 14.2px);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
h1 {
  margin: 14px 0 0;
  font-size: clamp(26px, 5vw, 46px);
  font-weight: 400;
  line-height: 1.05;
  letter-spacing: -.01em;
}
h1 i { font-style: italic; color: var(--red-ink); }
hr {
  border: 0;
  border-top: 1px solid var(--rule-strong);
  margin: 22px 0;
}
p {
  font-size: clamp(14px, 1.36vw, 17px);
  line-height: 1.5;
  color: var(--ink-2);
}
a.home {
  display: inline-block;
  margin-top: 26px;
  font-size: clamp(14px, 1.36vw, 17px);
  color: var(--red-ink);
  text-decoration: none;
  border-bottom: 1px solid currentColor;
  padding-bottom: 2px;
}
a.home:hover { color: var(--ink); }
</style>
