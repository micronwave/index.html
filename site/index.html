     picture the page is already showing at thumbnail size, so the cap is
     taken now if it can be and again when the picture says so. the handler
     reads whatever is in the plate at the moment it runs, so one left over
     from a shot walked past still sets the right number. */
  capPlate();
  if (!plateImg.complete) plateImg.addEventListener('load', capPlate, { once: true });
  /* showModal, not a div of our own: the top layer, the backdrop, esc and the
     inert page behind are all the browser's, and they behave the way the rest
     of the machine does */
  if (!plate.open) plate.showModal();
}

/* delegated — the detail is rewritten for every project, and a listener bound
   to the plate itself would be thrown away with it */
pdetail.addEventListener('click', (e) => { if (e.target.closest('.zoom')) showPlate(); });

/* the ways out are all the obvious one: the picture, the field around it, the
   word, and esc, which the dialog answers itself */
plate.addEventListener('click', (e) => { if (e.target === plate || e.target === plateImg) plate.close(); });
document.getElementById('plate-close').addEventListener('click', () => plate.close());
plate.addEventListener('close', () => {
  /* walking the shots rewrites the plate this was opened from, so focus goes
     back to the one standing there now rather than to a node off the page */
  const b = pdetail.querySelector('.zoom');
  if (b) b.focus({ preventScroll: true });
});

/* ── work: one role at a time, off the same rail ──────────────── */

const wlist = bandsEl.querySelector('.wlist');
const wdetail = document.getElementById('wdetail');
const workBand = bandsEl.querySelector('.band[data-id="work"]');
let roleIdx = 0;

/* both forms of the name are set into the chip and the stylesheet picks one,
   as it does in the project rail: the full name in the column, the short one
   in the row of chips a phone gets. only a name long enough to take a line of
   its own carries a short form — the rest are set once and shown everywhere. */
experience.forEach((j, i) => {
  /* the rail may name a place differently from the entry — see rail, which is
     the name the column is set in at every width. */
  const rail = j.rail || j.company;
  const b = el(
    '<button type="button" role="tab" id="rtab-' + i + '" aria-controls="wdetail"' +
    /* the width the name takes in 600 is reserved from this, and only where the
       rail is a row (see .wlist button::after) — so it is the form shown there */
    ' data-name="' + esc(j.short || rail) + '"' +
    ' aria-selected="' + (i === 0) + '" tabindex="' + (i === 0 ? '0' : '-1') + '">' +
    (j.short
      ? '<span class="full">' + esc(rail) + '</span><span class="abbr">' + esc(j.short) + '</span>'
      : esc(rail)) + '</button>'
  );
  b.addEventListener('click', () => selectRole(i));
  b.addEventListener('keydown', railKeys(wlist, selectRole, () => roleIdx));
  wlist.appendChild(b);
});

function selectRole(i) {
  roleIdx = (i + experience.length) % experience.length;
  const j = experience[roleIdx];
  [...wlist.children].forEach((b, n) => {
    b.setAttribute('aria-selected', String(n === roleIdx));
    b.tabIndex = n === roleIdx ? 0 : -1;
  });
  wdetail.setAttribute('aria-labelledby', 'rtab-' + roleIdx);

  wdetail.innerHTML =
    '<div class="whead">' +
      '<div class="wline">' +
        '<h3 class="wrole">' + esc(j.role) + '</h3>' +
        '<p class="wdates">' + esc(j.dates) + '</p>' +
      '</div>' +
      '<div class="wline">' +
        '<p class="wwhere">' + esc(j.company) + ' <span>&middot; ' + esc(j.location) + '</span></p>' +
      '</div>' +
    '</div>' +
    (j.notice ? '<p class="wnotice">' + esc(j.notice) + '</p>' : ruled(j.bullets));

  /* the bullets run in two columns, and which one opens the second is settled
     by measuring what has just been written — so it is settled here */
  markColumnOpeners();
  toTop(workBand);
}

/* the sheet is one screen and the page never scrolls. the entries are a fixed
   length and the window is not, so where the two disagree it is the open band
   that gives — it takes the scroll, and everything the entry says stays on the
   page. nothing is measured to decide this: the browser scrolls the box when
   the content is taller than the box and leaves it alone when it is not.

   what it replaces was a routine that binary-searched the number of bullets
   that would fit and hid the rest behind a "+N more" that could not be reached
   from anywhere. the about band had no such routine at all and simply lost its
   last line. both are now the same rule: the band scrolls, or it does not. */

/* an entry the reader has not seen should open at its first line */
function toTop(band) {
  const body = band.querySelector('.body');
  if (body) body.scrollTop = 0;
  markScroll(band);
}

/* the mark in the right rail: whether this band runs deeper than the room it
   has, how much of it is on the screen, and where in it the reader is. the
   thumb is placed from the band's own top, since that is what it is drawn on —
   the body sits below the strip, and the strip's height moves with the window.

   it is not measured on any schedule: a scroll, a tap on the rail, the window
   settling, and the band arriving at its full height are the only four moments
   any of these numbers can have changed. */
function markScroll(band) {
  const body = band.querySelector('.body');
  const mark = band.querySelector('.mark');
  const track = band.querySelector('.track');
  if (!body || !mark || !track) return;
  /* all four questions are asked before the class is written. a class set
     between two reads makes the browser lay the page out again to answer the
     second, on a frame that is already carrying a scroll. */
  const view = body.clientHeight;
  const full = body.scrollHeight;
  const at = body.scrollTop;
  const from = body.offsetTop;
  const over = full - view;
  const on = band.classList.contains('is-open') && over > 1;
  band.classList.toggle('is-scrollable', on);
  if (!on) return;
  /* the fade at the foot says there is more under the rule, so it has to go
     when there is not. the same pixel of tolerance the arrows keep at each
     end, for the same reason: a scroll box rounds.

     written only when it turns over. a scroll lands here on every frame, and
     a class set on the band re-resolves the style of everything under it —
     which is the whole open register — so the frames in the middle of a
     scroll, where the answer has not changed, write nothing. */
  const end = at >= over - 1;
  if (band.classList.contains('is-at-end') !== end) band.classList.toggle('is-at-end', end);
  /* the thumb is the visible share of the entry, floored so it stays a mark
     rather than a dot on a band that runs very deep */
  const h = Math.max(28, view * view / full);
  const y = from + (view - h) * (at / over);
  mark.style.transform = 'translateY(' + Math.round(y) + 'px) scaleY(' + h + ')';
  /* the track runs the entry's box, a cell per row of it. it is set only
     when the count moves — a tap on the rail or the window settling — and a
     scroll, which lands here on every frame, finds the same count and
     writes nothing. */
  const rows = Math.floor(view / 7);
  const key = rows + '@' + from;
  if (track.dataset.key !== key) {
    track.dataset.key = key;
    track.style.top = from + 'px';
    track.textContent = '▒\n'.repeat(rows);
  }
}

/* a scroll event arrives on every frame the finger is moving, and the four
   numbers above are all questions about layout — asked in the handler itself,
   each one lands on a document the handler before it has just written to, and
   the browser has to lay the page out again before it can answer. asked in the
   frame instead, the reads and the write happen once, together, after the
   scroll has already been taken into account; a second event in the same frame
   has nothing new to say and is dropped. */
let marking = 0;
function markSoon(band) {
  if (marking) return;
  marking = requestAnimationFrame(() => { marking = 0; markScroll(band); });
}

const still = matchMedia('(prefers-reduced-motion: reduce)');

/* the arrows walk the register stack, and a band deep enough to scroll sits in
   their way: they move through what it is still holding below the fold first,
   and step to the next register once it has nothing left to show in that
   direction. j and k stay the direct jump for anyone who wants past it, and
   1-4 skip the stack outright. returns whether the key was spent here. */
function scrolled(step) {
  const body = bandsEl.querySelector('.band.is-open .body');
  if (!body) return false;
  const end = body.scrollHeight - body.clientHeight;
  if (end < 2) return false;
  const at = body.scrollTop;
  /* a pixel of tolerance at each end: a scroll box rounds, and a band a
     fraction from its own floor should read as being on it */
  if (step > 0 ? at >= end - 1 : at <= 1) return false;
  body.scrollBy({
    top: step * Math.max(90, body.clientHeight * 0.62),
    behavior: still.matches ? 'auto' : 'smooth'
  });
  return true;
}

/* one listener for all four, on the way up: a scroll event does not bubble,
   but it does capture, and only one band is ever open to send one */
bandsEl.addEventListener('scroll', (e) => {
  const band = e.target.closest && e.target.closest('.band');
  if (band) markSoon(band);
}, true);

/* the band opens over .36s and only knows its height at the end of it, so the
   mark is struck when the movement stops rather than when it starts */
bandsEl.addEventListener('transitionend', (e) => {
  if (e.propertyName === 'flex-grow') markScroll(e.target);
});

/* when the bullets run in two columns, the item that starts the second one
   must not draw a rule above it — there is nothing above it. the balancer
   chooses that item by height, so it moves with the width: find it by
   measuring, not by counting. removing the rule shifts the balance by a
   pixel, so measure once more and settle. */
function markColumnOpeners() {
  for (let pass = 0; pass < 2; pass++) {
    const lis = [...wdetail.querySelectorAll('.ruled > li')];
    /* every edge is read first and the classes are written after, for the
       reason given in markScroll: a write in the middle of a run of reads is
       a page laid out again to answer the rest of them. */
    const x = lis.map((li) => Math.round(li.getBoundingClientRect().left));
    let moved = false;
    lis.forEach((li, n) => {
      /* the first bullet is marked too, and it has to be. it looks as though
         .ruled > li:first-child has already taken its rule off and this is
         saying the same thing twice — but under 560px the narrow block sets
         .wdetail .ruled > li, which carries two classes and one element to
         first-child's one class, one pseudo-class and one element. the two
         weigh the same, and the later of them wins: on a phone the first
         bullet of a role gets its top padding back from that rule, and this
         class, which outweighs both, is the only thing that takes it off
         again. taking the mark off the first item cost four pixels at the top
         of every role on every phone. */
      const opens = n === 0 || x[n] !== x[n - 1];
      if (li.classList.contains('opens-column') === opens) return;
      li.classList.toggle('opens-column', opens);
      moved = true;
    });
    if (!moved) return;
  }
}

selectRole(0);

/* a phone's address bar sliding in and out is a resize on every frame of the
   slide, and the page is set in svh so not one of those frames moves anything
   on it. so the box is asked whether it actually moved, and the whole slide
   costs one measurement instead of thirty rounds of measuring the bullets.

   the box asked is the register stack and not the sheet, because the sheet's
   own clientWidth is its padding box and the padding is not fixed: between
   1360px of window and about 1550px the sheet is already at its cap while
   --pad-x is still climbing with 4vw, so the sheet measures 1360 throughout
   and the measure inside it loses fifteen pixels. the stack sits in the
   sheet's content box — its width is the measure the type is cut from and
   its height is the room the bands divide — so it moves exactly when there is
   something here to redo, and at no other time. */
let lastW = bandsEl.clientWidth, lastH = bandsEl.clientHeight;
let resettle;
addEventListener('resize', () => {
  clearTimeout(resettle);
  /* the two columns rebalance with the width, so which bullet opens the second
     one moves with it; the copy button's two widths are set from the sheet's
     measure and move with it too. whether a band still overflows is the
     window's answer as much as the entry's, so the mark on the rail is struck
     again here. */
  resettle = setTimeout(() => {
    const w = bandsEl.clientWidth, h = bandsEl.clientHeight;
    if (w === lastW && h === lastH) return;
    lastW = w; lastH = h;
    markColumnOpeners();
    measureCopy();
    bandsEl.querySelectorAll('.band').forEach(markScroll);
  }, 120);
});

/* ── opening and closing ─────────────────────────────────────── */

let current = null;


function open(id) {
  if (id === current) return;
  current = id;
  bandsEl.querySelectorAll('.band').forEach((b) => {
    const on = b.dataset.id === id;
    b.classList.toggle('is-open', on);
    b.querySelector('.strip').setAttribute('aria-expanded', String(on));
  });
  /* a band left part-scrolled would open there the next time it is asked for.
     the mark comes off every band with it, and the fade at the foot with the
     mark: the one opening does not know its own height yet, and will strike
     its own when it gets there. */
  bandsEl.querySelectorAll('.band').forEach((b) => {
    b.querySelector('.body').scrollTop = 0;
    b.classList.remove('is-scrollable', 'is-at-end');
  });}

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  /* while a shot is open the page behind it is inert, so the arrows belong to
     the shot: left and right walk the plates, the rail follows underneath, and
     nothing else here acts on a page you cannot see. esc is the dialog's. */
  if (plate.open) {
    const s = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (s) { e.preventDefault(); selectProject(projIdx + s); showPlate(); }
    return;
  }
  const i = REGISTERS.findIndex((r) => r.id === current);
  if (e.key >= '1' && e.key <= String(REGISTERS.length)) { open(REGISTERS[Number(e.key) - 1].id); return; }
  const next = () => open(REGISTERS[(i + 1) % REGISTERS.length].id);
  const prev = () => open(REGISTERS[(i - 1 + REGISTERS.length) % REGISTERS.length].id);
  /* the arrows read the open band to its end before they leave it; j and k
     leave it whatever it is still holding */
  if (e.key === 'ArrowDown') { e.preventDefault(); if (!scrolled(1)) next(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); if (!scrolled(-1)) prev(); }
  if (e.key === 'j') { e.preventDefault(); next(); }
  if (e.key === 'k') { e.preventDefault(); prev(); }
  const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (!step) return;
  if (current === 'projects') selectProject(projIdx + step);
  if (current === 'work') selectRole(roleIdx + step);
});

/* ── the address ─────────────────────────────────────────────── */

/* clicking the address puts it on the clipboard rather than opening a mail
   client the visitor may not have. the button holds the state for a beat and
   then goes back — long enough to read, short enough that the word "email"
   is what the row says at rest. */

const copyBtn = document.getElementById('copy');
const copyFace = copyBtn.querySelector('.cface');
const copyState = document.getElementById('copystate');
let copyBack;

/* the cell has to be told both widths for it to travel between them. each word
   is measured on itself rather than on the cell — the cell is the other word's
   width half the time — and the type is set in container units, so this runs
   again whenever the sheet changes size. */
function measureCopy() {
  copyFace.querySelectorAll('.cw').forEach((word) => {
    const w = Math.ceil(word.getBoundingClientRect().width) + 'px';
    copyFace.style.setProperty(word.classList.contains('done') ? '--w-done' : '--w-rest', w);
  });
}
measureCopy();

/* Fraunces arrives after first paint and is wider than the fallback, so
   everything measured off the face is measured again once it lands: the copy
   cell's two widths, and which bullet opens the work register's second column
   — a balance struck in the fallback is struck on the wrong line heights. the
   entry is set in that wider face too, so a band that did not overflow in the
   fallback may well overflow now. */
function settle() {
  measureCopy();
  markColumnOpeners();
  bandsEl.querySelectorAll('.band').forEach(markScroll);
}
if (document.fonts) {
  document.fonts.ready.then(settle);
  /* and again on the event itself. the stylesheet that names Fraunces is no
     longer fetched in the render path (see the head), so at the moment this
     runs there may be no face in play at all — and fonts.ready answers at once
     when there is nothing to wait for, which would leave every measurement
     above struck in Georgia and never struck again. loadingdone fires when a
     face has actually arrived, whenever that turns out to be. */
  document.fonts.addEventListener('loadingdone', settle);
}

/* the clipboard API needs a secure context and a live user gesture; when it
   is refused, the old selection trick still works, and if that goes too the
   mail client is the honest last answer. */
function putOnClipboard(text) {
  if (navigator.clipboard && isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) => {
    const field = document.createElement('textarea');
    field.value = text;
    field.setAttribute('readonly', '');
    field.style.cssText = 'position:fixed;top:-100px;opacity:0';
    document.body.append(field);
    field.select();
    const ok = document.execCommand && document.execCommand('copy');
    field.remove();
    ok ? resolve() : reject(new Error('copy refused'));
  });
}

copyBtn.addEventListener('click', () => {
  const address = copyBtn.dataset.address;
  putOnClipboard(address).then(() => {
    clearTimeout(copyBack);
    copyBtn.classList.add('is-copied');
    /* the visible word is hidden from readers — this is what they hear, and
       it has to change to be spoken, so it is cleared on the way back */
    copyState.textContent = 'Email address copied';
    copyBack = setTimeout(() => {
      copyBtn.classList.remove('is-copied');
      copyState.textContent = '';
    }, 1900);
  }).catch(() => {
    location.href = 'mailto:' + address;
  });
});

/* ── go ──────────────────────────────────────────────────────── */

open('about');
void document.body.offsetHeight;
document.body.classList.add('ready');
/* the first band opens before the transition is armed, so it arrives at its
   full height without ever ending a transition — its mark is struck by hand */
bandsEl.querySelectorAll('.band').forEach(markScroll);
</script>
<script>
/* ── the order ────────────────────────────────────────────────
   A classical column, a lit solid quantised into block glyphs.

   Everything here is modelled rather than stored. One order at thirty
   light angles and every height of glass would be a good deal of text
   to ship, and the whole reason for modelling the thing is that the
   light, the flute count and the crop are all just numbers. The shaft is about 7,500 cells at nine
   samples each — some 67,000 evaluations of the field stack, which
   measures at eight to twelve milliseconds of main thread per
   redraw on a desktop. It is not free, which is why it runs on a
   timer a few times a minute and not on the frame, and why it does
   not run at all when the strip is hidden or the tab is.

   This runs after the script above it and only ever adds: it reads
   nothing the contents page owns and touches nothing it owns either.
   ──────────────────────────────────────────────────────────── */
(function () {
  'use strict';

  var RAMP = ' ░▒▓█';   /* paper first, solid last */
  var SS = 3;                               /* samples per axis, per cell */

  /* the constants below were tuned against the figure rather than reasoned
     out, so they are left reachable: ?az=0&amb=0.05&tilt=1 and so on. they
     change nothing unless asked for. */
  var Q = new URLSearchParams(location.search);
  function num(k, d) { var v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; }

  /* ambient. marble in daylight is never a silhouette — the side turned away
     from the sun is still lit by the sky. without this every surface past
     ninety degrees fell to the solid glyph and the shaft read as a black bar
     with two grey channels in it. */
  var AMB   = num('amb', 0.16);
  var GAIN  = num('gain', 1.55);
  var PIVOT = num('pivot', 0.52);
  var TILT  = num('tilt', 0.78);
  var AZMAX = num('azmax', 0.34);

  function lift(v) { return AMB + (1 - AMB) * v; }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  /* ── the grid ─────────────────────────────────────────────────
     One measurement, one rasteriser, for every figure on the page.
     The cell is measured rather than assumed: the usual half-width
     is only true of some faces, and every proportion below is
     stated in character columns and converted through this ratio. */

  function measure(el) {
    var probe = document.createElement('span');
    probe.textContent = new Array(41).join('█');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font:inherit';
    el.appendChild(probe);
    var r = probe.getBoundingClientRect();
    probe.remove();
    return { w: r.width / 40, h: r.height };
  }

  function fit(el) {
    var m = measure(el), box = el.getBoundingClientRect();
    if (!m.w || !m.h || !box.width || !box.height) return null;
    return {
      cols: Math.floor(box.width / m.w),
      /* up, not down: a row short leaves a sliver of paper under the base
         on most heights. the extra row runs past the glass and is clipped. */
      rows: Math.ceil(box.height / m.h),
      cell: m.w / m.h
    };
  }

  /* fields return shadow in [0,1] for a point, or null for "not on me".
     Coverage rides with the shading, so a silhouette edge lands as a lighter
     glyph rather than a hard jump — which is the only reason a shaft this
     narrow can still show its flutes. */
  /* returns the figure as text rather than setting it: both strips are the
     same size and take the same light, so it is drawn once and set twice */
  function raster(f, fields, gain, pivot) {
    var w = f.cols, h = f.rows, n = SS * SS;
    var g = new Array(w * h);
    for (var i = 0; i < g.length; i++) g[i] = ' ';
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var acc = 0, cov = 0;
        for (var sy = 0; sy < SS; sy++) {
          var py = y + (sy + 0.5) / SS;
          for (var sx = 0; sx < SS; sx++) {
            var px = x + (sx + 0.5) / SS, s = null;
            for (var k = 0; k < fields.length; k++) {
              s = fields[k](px, py);
              if (s !== null) break;
            }
            if (s === null) continue;
            acc += s; cov++;
          }
        }
        if (!cov) continue;
        var v = (acc / cov) * (cov / n);
        v = 0.5 + (v - pivot) * gain;
        var q = Math.round(clamp01(v) * (RAMP.length - 1));
        if (q > 0) g[y * w + x] = RAMP[q];
      }
    }
    var out = [];
    for (var r = 0; r < h; r++) {
      out.push(g.slice(r * w, r * w + w).join('').replace(/\s+$/, ''));
    }
    return out.join('\n');
  }

  /* ── light ────────────────────────────────────────────────────
     The angle is the sun's, and the sun is the one the reader is
     under: the figure is lit from
     the east in the morning and the west in the evening. On top of
     that the source rakes — a couple of degrees over two minutes,
     meant to be noticed on the second visit rather than the first. */

  function solar(now) {
    var mins = now.getHours() * 60 + now.getMinutes();
    var day = (mins - 360) / 720;              /* 0 at 06:00, 1 at 18:00 */
    if (day < 0 || day > 1) return { az: day < 0 ? -0.9 : 0.9, elev: 0.42 };
    return { az: -0.95 + 1.9 * day, elev: 0.28 + 0.72 * Math.sin(Math.PI * day) };
  }

  /* the sun's own range is the whole sky; the figure's is not. past about
     half a radian off axis the lit side saturates — every flute on it
     returns the same lambert and comes back as one flat glyph — and all the
     modelling collapses onto the shadow side. the hour still says where the
     light comes from; it does it inside the arc five glyphs can resolve. */
  function lightAt(t) {
    var s = solar(new Date());
    var base = Q.has('az') ? num('az', 0) : s.az * AZMAX;
    var az = Math.max(-AZMAX, Math.min(AZMAX, base + Math.sin(t / 19000) * 0.055));
    var z = Math.sqrt(Math.max(0.04, 1 - az * az)) * (0.55 + 0.45 * s.elev);
    return { x: az, z: z };
  }

  /* ── surfaces ─────────────────────────────────────────────── */

  function fluteShadow(u, flutes, L, arrisGain) {
    if (u < -1 || u > 1) return null;
    var theta = Math.asin(u);
    var curve = 0.30 + 0.70 * Math.pow(Math.cos(theta), 0.55);

    /* One flute is ONE sweep of the local normal, not one sine wave: the
       surface between two arrises is a single concave arc, so the tilt runs
       from -T at one edge, through zero at the deepest point, to +T at the
       next. Modelled with a full sine per flute, every flute gets two
       grooves, the count comes out doubled, and the shaft reads as a
       barcode instead of as stone. */
    var half = flutes / 2;
    var f = (theta + Math.PI / 2) / Math.PI * half;
    var edge = Math.cos(Math.PI * (f - Math.floor(f)));
    var tilt = -TILT * edge;

    /* the tilted normal carries the cylinder's own turn as well as the
       groove's, so one lambert does both and the form cannot drift out of
       step with the flutes cut into it */
    var cut = Math.max(0, Math.sin(theta + tilt) * L.x + Math.cos(theta + tilt) * L.z);
    var lit = lift(cut * curve) + Math.pow(Math.abs(edge), 10) * arrisGain;
    return 1 - clamp01(lit);
  }

  function smoothDrum(u, L) {
    if (u < -1 || u > 1) return null;
    var theta = Math.asin(u);
    var lam = Math.max(0, Math.sin(theta) * L.x + Math.cos(theta) * L.z);
    return 1 - lift(lam * (0.35 + 0.65 * Math.pow(Math.cos(theta), 0.4)));
  }

  /* the shaft: tapered, fluted, and — when drums is set — cut into the drums
     it was built from — a course line every so often, catching light on its
     upper edge and holding shade under it. a column is a stack. */
  function shaftField(cx, top, bot, rad, o, L) {
    var h = Math.max(1, bot - top);
    return function (px, py) {
      if (py < top || py >= bot) return null;
      var v = (py - top) / h;
      var r = 1 - o.entasis * Math.pow(1 - v, 1.6);
      if (r <= 0.02) return null;
      var u = (px - cx) / (rad * r);
      var s = o.flutes ? fluteShadow(u, o.flutes, L, 0.2) : smoothDrum(u, L);
      if (s === null) return null;
      if (o.drums) {
        var d = v * o.drums - Math.floor(v * o.drums);
        if (d < 0.055) s = Math.min(1, s + 0.42 * (1 - d / 0.055));
        else if (d > 0.965) s = Math.max(0, s - 0.3);
      }
      return s;
    };
  }

  function slabField(x0, x1, top, bot, face, bevel) {
    return function (px, py) {
      if (py < top || py >= bot || px < x0 || px >= x1) return null;
      var t = (py - top) / Math.max(1, bot - top);
      var u = Math.abs((px - (x0 + x1) / 2) / Math.max(1, (x1 - x0) / 2));
      return 1 - (face - bevel * Math.pow(u, 4) - 0.2 * t);
    };
  }

  function echinusField(cx, top, bot, neckR, outR, L) {
    var h = Math.max(1, bot - top);
    return function (px, py) {
      if (py < top || py >= bot) return null;
      var t = (py - top) / h;
      var w = neckR + (outR - neckR) * Math.pow(t, 0.58);
      var u = (px - cx) / w;
      if (u < -1 || u > 1) return null;
      var theta = Math.asin(u);
      var lam = Math.max(0, Math.sin(theta) * L.x + Math.cos(theta) * L.z);
      return 1 - lift(lam * (0.55 + 0.45 * t));
    };
  }

  /* ── the order ────────────────────────────────────────────────
     One order, on every register: the doric of the about band, which
     is the one that reads at this width. Fourteen flutes, not the
     twenty a Doric shaft actually carries: at two and a bit cells each
     they antialias into mush, and a shaft that reads as fluted beats
     one that is accurately fluted. */
  var ORDER = { flutes: 14, entasis: 0.13, drums: 0 };

  function columnFields(f, L) {
    var o = ORDER;
    var w = f.cols, h = f.rows;
    var cx = w / 2, rad = w * 0.315, fields = [];

    var abH = Math.max(2, Math.round(h * 0.022));
    var capH = Math.max(3, Math.round(h * 0.045));
    var baseH = Math.max(3, Math.round(h * 0.045));

    var aw = rad * 1.5;
    fields.push(slabField(cx - aw, cx + aw, 0, abH, 0.74, 0.22));

    var capTop = abH, capBot = abH + capH;
    fields.push(echinusField(cx, capTop, capBot, rad * 1.5, rad * 0.99, L));

    var shBot = h - baseH;
    fields.push(shaftField(cx, capBot, shBot, rad, o, L));
    fields.push(slabField(cx - rad * 1.4, cx + rad * 1.4, shBot, shBot + baseH * 0.6, 0.66, 0.12));
    fields.push(slabField(0, w, shBot + baseH * 0.6, h, 0.5, 0));
    return fields;
  }

  /* ── the machine register ───────────────────────────────────── */

  function machine() {
    /* the texture layer belongs to the viewport and nothing else: a fixed
       pseudo-element on the body is one more thing for the sheet's grid to
       carry. */
    var grain = document.createElement('div');
    grain.className = 'grain';
    grain.setAttribute('aria-hidden', 'true');
    document.body.appendChild(grain);
  }

  /* ── running it ───────────────────────────────────────────── */

  machine();

  var orders = [document.getElementById('order'), document.getElementById('order-r')]
    .filter(Boolean);
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  /* the same line the stylesheet draws at .order. below it the strip is
     display:none, and a measurement taken inside a box that has no layout
     still costs one: the probe is appended, the style is resolved, and the
     answer is zero. so the question is asked of the query instead, and the
     timer is not started for a column nobody can see. */
  var narrow = window.matchMedia('(max-width: 980px)');

  function paintColumn(t) {
    if (!orders.length || narrow.matches) return;
    var f = fit(orders[0]);
    if (!f || f.cols < 8 || f.rows < 8) return;
    var text = raster(f, columnFields(f, lightAt(t)), GAIN, PIVOT);
    for (var i = 0; i < orders.length; i++) orders[i].textContent = text;
  }

  /* the light moves slowly and on purpose, so this is a timer rather than an
     animation frame: a rAF loop that spends every frame deciding not to draw
     still keeps the compositor awake for as long as the tab is open, which is
     a poor trade on a page whose whole argument is that it does nothing. */
  var timer = 0;
  function tick() {
    if (document.hidden) return;
    paintColumn(performance.now());
  }
  function run() {
    clearInterval(timer);
    paintColumn(performance.now());
    if (!reduced.matches && !narrow.matches) timer = setInterval(tick, 1100);
  }
  /* either preference can change under a live page — a window dragged past
     the line, a system setting flipped — and the timer has to follow */
  [narrow, reduced].forEach(function (mq) {
    if (mq.addEventListener) mq.addEventListener('change', run);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    tick();
  });

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      run();
    }, 200);
  });

  /* the face has to be here before anything is measured against it */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
  run();
})();
</script>

</body>
</html>
